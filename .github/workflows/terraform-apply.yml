name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: '(optional) Run ID of the Terraform Plan run to download the plan from'
        required: false
        type: string

jobs:
  terraform_apply:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact from specified run
        if: ${{ github.event.inputs.plan_run_id != '' }}
        run: |
          RUN_ID=${{ github.event.inputs.plan_run_id }}
          REPO=${{ github.repository }}
          echo "Checking artifacts for run id: $RUN_ID in repo $REPO"
          resp=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts")
          echo "API response (first 200 chars):"
          echo "${resp:0:200}"
          # Extract artifact names without jq
          names=$(echo "$resp" | grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' | sed -E 's/"name"[[:space:]]*:[[:space:]]*"([^"]*)"/\1/')
          echo "Found artifacts:"
          echo "$names"
          echo "$names" | grep -x "tfplan" >/dev/null 2>&1 || (echo "::error::Artifact 'tfplan' not found in run ${RUN_ID}. Available artifacts:" && echo "$names" && exit 1)
        shell: bash

      - name: Download plan artifact
        if: ${{ github.event.inputs.plan_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.plan_run_id }}
          name: tfplan
          path: .

      - name: No plan artifact provided
        if: ${{ github.event.inputs.plan_run_id == '' }}
        run: echo "No plan_run_id provided; apply will run directly unless you upload a plan artifact manually."

      - name: Terraform apply (use plan if available)
        run: |
          if [ -f ./tfplan ]; then
            terraform apply -input=false ./tfplan
          else
            terraform apply -auto-approve
          fi
