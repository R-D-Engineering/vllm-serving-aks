name: Terraform Destroy

on:
  workflow_dispatch: {}

jobs:
  terraform_destroy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_TOKEN_APP_TERRAFORM_IO: ${{ secrets.TERRAFORM_TOKEN }}
      TF_ORG: azureai_infra
      TF_WORKSPACE: vllm-serving-aks
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Check Terraform Cloud token & workspace access (pre-init)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}")
          if [ "$status" = "200" ]; then
            echo "Terraform Cloud workspace reachable; using Cloud backend."
            echo "LOCAL_FALLBACK=0" >> $GITHUB_ENV
          else
            echo "::warning::Terraform Cloud API returned $status. Token may lack workspace access or workspace doesn't exist. Falling back to local backend for destroy." \
              && echo "LOCAL_FALLBACK=1" >> $GITHUB_ENV
            echo "API response:" \
              && curl -s -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}" || true
          fi

      - name: Terraform init (cloud or local fallback)
        run: |
          if [ "${LOCAL_FALLBACK}" = "1" ]; then
            terraform init -backend=false -input=false
          else
            terraform init -input=false
          fi

      - name: Terraform destroy
        run: |
          if [ "${LOCAL_FALLBACK}" = "1" ]; then
            terraform destroy -auto-approve
          else
            terraform destroy -auto-approve
          fi
