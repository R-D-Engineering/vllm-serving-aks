name: Terraform Plan

on:
  workflow_dispatch: {}

jobs:
  terraform:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_APP_TERRAFORM_IO: ${{ secrets.TERRAFORM_TOKEN }}
      TF_ORG: azureai_infra
      TF_WORKSPACE: vllm-serving-aks
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Check Terraform Cloud token & workspace access
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}")
          if [ "$status" != "200" ]; then
            echo "::error::Terraform Cloud API returned $status. Token may lack workspace access or workspace doesn't exist."
            curl -s -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}" || true
            exit 1
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
