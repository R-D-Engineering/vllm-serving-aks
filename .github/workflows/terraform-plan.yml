name: Terraform Plan

on:
  workflow_dispatch: {}

jobs:
  terraform:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_APP_TERRAFORM_IO: ${{ secrets.TERRAFORM_TOKEN }}
      TF_ORG: azureai_infra
      TF_WORKSPACE: vllm-serving-aks
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Check Terraform Cloud token & workspace access (pre-init)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}")
          if [ "$status" = "200" ]; then
            echo "Terraform Cloud workspace reachable; using Cloud backend."
            echo "LOCAL_FALLBACK=0" >> $GITHUB_ENV
          else
            echo "::warning::Terraform Cloud API returned $status. Token may lack workspace access or workspace doesn't exist. Falling back to local backend for plan." \
              && echo "LOCAL_FALLBACK=1" >> $GITHUB_ENV
            echo "API response:" \
              && curl -s -H "Authorization: Bearer $TF_TOKEN_APP_TERRAFORM_IO" -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}" || true
          fi

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (cloud or local fallback)
        run: |
          if [ "${LOCAL_FALLBACK}" = "1" ]; then
            terraform init -backend=false -input=false
          else
            terraform init -input=false
          fi

      - name: Terraform plan (with automatic fallback on permission error)
        run: |
          set -o pipefail
          mkdir -p terraform
          terraform plan -out=terraform/tfplan -input=false 2>&1 | tee terraform/plan.log
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then
            echo "Plan succeeded against configured backend."
            exit 0
          fi

          # If plan failed due to insufficient rights on Terraform Cloud, retry locally
          if grep -i -E "insufficient rights|insufficient permissions|permission" terraform/plan.log >/dev/null 2>&1; then
            echo "::warning::Plan failed due to permission error in Terraform Cloud. Retrying with local backend (backend=false)."
            terraform init -backend=false -input=false
            terraform plan -out=terraform/tfplan -input=false 2>&1 | tee terraform/plan-local.log
            rc2=${PIPESTATUS[0]}
            if [ $rc2 -ne 0 ]; then
              echo "::error::Local plan also failed. See terraform/plan-local.log"
              cat terraform/plan-local.log || true
              exit $rc2
            fi
            # mark local plan so apply knows to use local backend
            echo "local" > terraform/tfplan_local
          else
            echo "::error::terraform plan failed (non-permission error). See terraform/plan.log"
            cat terraform/plan.log || true
            exit $rc
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan*
          name: tfplan
          path: terraform/tfplan*
